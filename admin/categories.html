<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - DESKCRAFT Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="bg-stone-50 flex min-h-screen">

    <div id="admin-sidebar-mount"></div>
    <div class="flex-1 flex flex-col min-h-screen">
        <div id="admin-topbar-mount"></div>

        <main class="flex-1 p-4 sm:p-8">

            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-6">
                <div>
                    <h2 class="text-xl font-bold text-stone-900">Categories</h2>
                    <p class="text-sm text-stone-500">Organize products into browsable categories.</p>
                </div>
                <button onclick="openModal()" class="bg-stone-900 text-white px-4 py-2.5 rounded-lg text-sm font-medium hover:bg-stone-800 inline-flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> Add Category
                </button>
            </div>

            <div class="bg-white rounded-xl border border-stone-100 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="admin-table">
                        <thead><tr><th>Name</th><th>Slug</th><th>Description</th><th>Products</th><th class="text-right pr-6">Actions</th></tr></thead>
                        <tbody id="cat-body"></tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <div id="modal-root"></div>

    <script src="../js/main.js"></script>
    <script src="admin.js"></script>
    <script>
        requireAdmin();
        renderAdminLayout('categories', 'Category Management');

        function renderList() {
            var body = document.getElementById('cat-body');
            var cats = getCategories();
            var allProducts = getProducts();
            if (!cats.length) { body.innerHTML = '<tr><td colspan="5" class="text-center text-stone-400 py-8">No categories yet.</td></tr>'; return; }
            var html = '';
            for (var i = 0; i < cats.length; i++) {
                var c = cats[i];
                var count = allProducts.filter(function (p) { return p.category === c.slug; }).length;
                html +=
                    '<tr>' +
                    '  <td class="font-medium">' + esc(c.name) + '</td>' +
                    '  <td><code class="text-xs bg-stone-100 px-2 py-1 rounded">' + esc(c.slug) + '</code></td>' +
                    '  <td class="text-stone-500">' + esc(c.description || '') + '</td>' +
                    '  <td>' + count + '</td>' +
                    '  <td class="text-right pr-6 space-x-2">' +
                    '    <button onclick="openModal(' + c.id + ')" class="text-stone-600 hover:text-stone-900"><i class="fa-solid fa-pen-to-square"></i></button>' +
                    '    <button onclick="deleteCategory(' + c.id + ')" class="text-red-600 hover:text-red-800"><i class="fa-solid fa-trash"></i></button>' +
                    '  </td>' +
                    '</tr>';
            }
            body.innerHTML = html;
        }

        function openModal(id) {
            var editing = getCategories().find(function (c) { return c.id === id; });
            document.getElementById('modal-root').innerHTML =
                '<div class="modal-backdrop" onclick="if(event.target===this)closeModal()">' +
                '  <div class="modal-card p-6">' +
                '    <div class="flex items-center justify-between mb-4"><h3 class="text-lg font-semibold">' + (editing ? 'Edit Category' : 'Add Category') + '</h3><button onclick="closeModal()" class="text-stone-400 hover:text-stone-700"><i class="fa-solid fa-xmark"></i></button></div>' +
                '    <form onsubmit="saveForm(event,' + (editing ? editing.id : 'null') + ')" novalidate class="space-y-4">' +
                '      <div><label class="block text-sm font-medium text-stone-700 mb-1">Name</label><input id="c-name" class="form-input w-full border border-stone-200 rounded-lg px-4 py-2.5 text-sm" value="' + esc(editing ? editing.name : '') + '"></div>' +
                '      <div><label class="block text-sm font-medium text-stone-700 mb-1">Slug</label><input id="c-slug" class="form-input w-full border border-stone-200 rounded-lg px-4 py-2.5 text-sm" value="' + esc(editing ? editing.slug : '') + '"><p class="text-xs text-stone-400 mt-1">Lowercase, no spaces. Used in URLs.</p></div>' +
                '      <div><label class="block text-sm font-medium text-stone-700 mb-1">Description</label><textarea id="c-desc" rows="2" class="form-input w-full border border-stone-200 rounded-lg px-4 py-2.5 text-sm">' + esc(editing ? (editing.description || '') : '') + '</textarea></div>' +
                '      <div class="flex justify-end gap-2 pt-2"><button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm text-stone-600 hover:bg-stone-100">Cancel</button><button type="submit" class="bg-stone-900 text-white px-5 py-2 rounded-lg text-sm font-medium hover:bg-stone-800">' + (editing ? 'Save' : 'Create') + '</button></div>' +
                '    </form>' +
                '  </div>' +
                '</div>';
        }
        function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

        function saveForm(e, id) {
            e.preventDefault();
            var name = document.getElementById('c-name').value.trim();
            var slug = document.getElementById('c-slug').value.trim().toLowerCase().replace(/\s+/g, '-');
            var desc = document.getElementById('c-desc').value.trim();
            if (!name || !slug) { showToast('Name and slug are required'); return; }
            var cats = getCategories();
            if (id) {
                var c = cats.find(function (x) { return x.id === id; });
                if (!c) return;
                c.name = name; c.slug = slug; c.description = desc;
            } else {
                var nextId = cats.length ? Math.max.apply(null, cats.map(function (x) { return x.id; })) + 1 : 1;
                cats.push({ id: nextId, name: name, slug: slug, description: desc });
            }
            saveCategories(cats);
            closeModal();
            renderList();
            showToast('Category saved');
        }

        function deleteCategory(id) {
            var cats = getCategories();
            var c = cats.find(function (x) { return x.id === id; });
            if (!c) return;
            var count = getProducts().filter(function (p) { return p.category === c.slug; }).length;
            if (count > 0) { if (!confirm(count + ' product(s) still use this category. Delete anyway?')) return; }
            else if (!confirm('Delete this category?')) return;
            saveCategories(cats.filter(function (x) { return x.id !== id; }));
            renderList();
            showToast('Category deleted');
        }

        renderList();
    </script>
</body>
</html>
