<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviews - DESKCRAFT Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="bg-stone-50 flex min-h-screen">

    <div id="admin-sidebar-mount"></div>
    <div class="flex-1 flex flex-col min-h-screen">
        <div id="admin-topbar-mount"></div>

        <main class="flex-1 p-4 sm:p-8">

            <div class="mb-6">
                <h2 class="text-xl font-bold text-stone-900">Reviews & Feedback</h2>
                <p class="text-sm text-stone-500">Approve or reject user reviews and respond to feedback.</p>
            </div>

            <div class="bg-white rounded-xl border border-stone-100 p-4 mb-4 flex flex-wrap gap-2">
                <button onclick="setFilter('all')"       data-f="all"      class="filter-btn text-sm px-4 py-2 rounded-lg bg-stone-900 text-white">All</button>
                <button onclick="setFilter('pending')"   data-f="pending"  class="filter-btn text-sm px-4 py-2 rounded-lg text-stone-600 hover:bg-stone-100">Pending</button>
                <button onclick="setFilter('approved')"  data-f="approved" class="filter-btn text-sm px-4 py-2 rounded-lg text-stone-600 hover:bg-stone-100">Approved</button>
                <button onclick="setFilter('rejected')"  data-f="rejected" class="filter-btn text-sm px-4 py-2 rounded-lg text-stone-600 hover:bg-stone-100">Rejected</button>
            </div>

            <div id="list" class="space-y-4"></div>

        </main>
    </div>

    <script src="../js/main.js"></script>
    <script src="admin.js"></script>
    <script>
        requireAdmin();
        renderAdminLayout('reviews', 'Reviews & Feedback');

        var currentFilter = 'all';

        function setFilter(f) {
            currentFilter = f;
            var btns = document.querySelectorAll('.filter-btn');
            for (var i = 0; i < btns.length; i++) {
                var active = btns[i].getAttribute('data-f') === f;
                btns[i].className = 'filter-btn text-sm px-4 py-2 rounded-lg ' + (active ? 'bg-stone-900 text-white' : 'text-stone-600 hover:bg-stone-100');
            }
            renderList();
        }

        function productName(id) {
            var p = getProducts().find(function (x) { return x.id === id; });
            return p ? p.name : 'Unknown product';
        }

        function renderList() {
            var list = getReviews();
            if (currentFilter !== 'all') list = list.filter(function (r) { return r.status === currentFilter; });
            list.sort(function (a, b) { return a.date < b.date ? 1 : -1; });

            var root = document.getElementById('list');
            if (!list.length) { root.innerHTML = '<div class="bg-white border border-stone-100 rounded-xl p-12 text-center text-stone-400">No reviews to show.</div>'; return; }

            var html = '';
            for (var i = 0; i < list.length; i++) {
                var r = list[i];
                var stars = '';
                for (var s = 1; s <= 5; s++) { stars += '<span class="star ' + (s <= r.rating ? 'filled' : '') + '">&#9733;</span>'; }
                var statusBadgeCls = r.status === 'approved' ? 'bg-green-50 text-green-700 border-green-200' : (r.status === 'rejected' ? 'bg-red-50 text-red-700 border-red-200' : 'bg-amber-50 text-amber-700 border-amber-200');
                var replyBlock = r.reply ? '<div class="mt-3 pl-4 border-l-2 border-amber-700"><p class="text-xs font-semibold text-amber-700 mb-1">Your reply:</p><p class="text-sm text-stone-600">' + esc(r.reply) + '</p></div>' : '';

                html +=
                    '<div class="bg-white border border-stone-100 rounded-xl p-5">' +
                    '  <div class="flex items-start justify-between gap-3 flex-wrap mb-3">' +
                    '    <div>' +
                    '      <p class="text-sm font-semibold">' + esc(r.userName) + ' &middot; <span class="text-stone-500 font-normal">' + esc(productName(r.productId)) + '</span></p>' +
                    '      <div class="text-sm mt-1">' + stars + ' <span class="text-xs text-stone-400 ml-1">' + esc(r.date) + '</span></div>' +
                    '    </div>' +
                    '    <span class="text-xs font-medium px-2.5 py-1 rounded-full border capitalize ' + statusBadgeCls + '">' + r.status + '</span>' +
                    '  </div>' +
                    '  <p class="text-stone-700 text-sm leading-relaxed">' + esc(r.comment) + '</p>' +
                    '  ' + replyBlock +
                    '  <div class="flex flex-wrap gap-2 mt-4 pt-4 border-t border-stone-100">' +
                    (r.status !== 'approved' ? '<button onclick="setStatus(' + r.id + ',\'approved\')" class="text-xs bg-green-600 text-white px-3 py-1.5 rounded-lg hover:bg-green-700"><i class="fa-solid fa-check mr-1"></i>Approve</button>' : '') +
                    (r.status !== 'rejected' ? '<button onclick="setStatus(' + r.id + ',\'rejected\')" class="text-xs bg-stone-200 text-stone-700 px-3 py-1.5 rounded-lg hover:bg-stone-300"><i class="fa-solid fa-xmark mr-1"></i>Reject</button>' : '') +
                    '    <button onclick="openReply(' + r.id + ')" class="text-xs bg-stone-900 text-white px-3 py-1.5 rounded-lg hover:bg-stone-800"><i class="fa-solid fa-reply mr-1"></i>' + (r.reply ? 'Edit Reply' : 'Reply') + '</button>' +
                    '    <button onclick="deleteReview(' + r.id + ')" class="text-xs bg-red-50 text-red-700 px-3 py-1.5 rounded-lg hover:bg-red-100"><i class="fa-solid fa-trash mr-1"></i>Delete</button>' +
                    '  </div>' +
                    '</div>';
            }
            root.innerHTML = html;
        }

        function setStatus(id, status) {
            var list = getReviews();
            var r = list.find(function (x) { return x.id === id; });
            if (!r) return;
            r.status = status;
            saveReviews(list);
            renderList();
            showToast('Review ' + status);
        }

        function openReply(id) {
            var list = getReviews();
            var r = list.find(function (x) { return x.id === id; });
            if (!r) return;
            var reply = prompt('Your reply to this review:', r.reply || '');
            if (reply === null) return;
            r.reply = reply.trim();
            saveReviews(list);
            renderList();
            showToast('Reply saved');
        }

        function deleteReview(id) {
            if (!confirm('Delete this review?')) return;
            saveReviews(getReviews().filter(function (r) { return r.id !== id; }));
            renderList();
            showToast('Review deleted');
        }

        renderList();
    </script>
</body>
</html>
