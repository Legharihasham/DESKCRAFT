<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - DESKCRAFT Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="bg-stone-50 flex min-h-screen">

    <div id="admin-sidebar-mount"></div>
    <div class="flex-1 flex flex-col min-h-screen">
        <div id="admin-topbar-mount"></div>

        <main class="flex-1 p-4 sm:p-8">

            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-6">
                <div>
                    <h2 class="text-xl font-bold text-stone-900">Products</h2>
                    <p class="text-sm text-stone-500">Add, edit, or remove products and track stock.</p>
                </div>
                <button onclick="openProductModal()" class="bg-stone-900 text-white px-4 py-2.5 rounded-lg text-sm font-medium hover:bg-stone-800 inline-flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> Add Product
                </button>
            </div>

            <div class="bg-white rounded-xl border border-stone-100 p-4 mb-4 flex flex-col sm:flex-row gap-3">
                <input id="search" type="text" placeholder="Search by name..." class="form-input flex-1 border border-stone-200 rounded-lg px-4 py-2.5 text-sm" oninput="renderProducts()">
                <select id="category-filter" class="form-input border border-stone-200 rounded-lg px-4 py-2.5 text-sm bg-white" onchange="renderProducts()">
                    <option value="all">All categories</option>
                </select>
            </div>

            <div class="bg-white rounded-xl border border-stone-100 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Product</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Stock</th>
                                <th class="text-right pr-6">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="products-body"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div id="modal-root"></div>

    <script src="../js/main.js"></script>
    <script src="admin.js"></script>
    <script>
        requireAdmin();
        renderAdminLayout('products', 'Product Management');

        function loadCategoryFilter() {
            var select = document.getElementById('category-filter');
            var cats = getCategories();
            for (var i = 0; i < cats.length; i++) {
                var opt = document.createElement('option');
                opt.value = cats[i].slug;
                opt.textContent = cats[i].name;
                select.appendChild(opt);
            }
        }

        function renderProducts() {
            var body = document.getElementById('products-body');
            var search = (document.getElementById('search').value || '').toLowerCase();
            var cat = document.getElementById('category-filter').value;
            var list = getProducts().filter(function (p) {
                var matchesSearch = p.name.toLowerCase().indexOf(search) !== -1;
                var matchesCat = cat === 'all' || p.category === cat;
                return matchesSearch && matchesCat;
            });

            if (!list.length) {
                body.innerHTML = '<tr><td colspan="5" class="text-center text-stone-400 py-8">No products match your filters.</td></tr>';
                return;
            }

            var html = '';
            for (var i = 0; i < list.length; i++) {
                var p = list[i];
                var stockBadge = p.stock === 0 ? 'text-red-700 bg-red-50' : (p.stock < 10 ? 'text-amber-700 bg-amber-50' : 'text-emerald-700 bg-emerald-50');
                html +=
                    '<tr>' +
                    '  <td><div class="flex items-center gap-3">' +
                    '    <img src="../' + esc(p.image) + '" alt="" class="w-12 h-12 rounded-lg object-cover">' +
                    '    <div><p class="font-medium">' + esc(p.name) + '</p><p class="text-xs text-stone-400 line-clamp-1">' + esc(p.description.slice(0, 60)) + '...</p></div>' +
                    '  </div></td>' +
                    '  <td class="text-stone-500 capitalize">' + esc(p.category) + '</td>' +
                    '  <td class="font-semibold">' + fmtPrice(p.price) + '</td>' +
                    '  <td><span class="text-xs font-semibold px-2.5 py-1 rounded-full ' + stockBadge + '">' + p.stock + '</span></td>' +
                    '  <td class="text-right pr-6 space-x-2">' +
                    '    <button onclick="openProductModal(' + p.id + ')" class="text-stone-600 hover:text-stone-900" title="Edit"><i class="fa-solid fa-pen-to-square"></i></button>' +
                    '    <button onclick="deleteProduct(' + p.id + ')" class="text-red-600 hover:text-red-800" title="Delete"><i class="fa-solid fa-trash"></i></button>' +
                    '  </td>' +
                    '</tr>';
            }
            body.innerHTML = html;
        }

        function openProductModal(id) {
            var editing = getProducts().find(function (p) { return p.id === id; });
            var cats = getCategories();
            var catOpts = '';
            for (var i = 0; i < cats.length; i++) {
                catOpts += '<option value="' + cats[i].slug + '"' + (editing && editing.category === cats[i].slug ? ' selected' : '') + '>' + esc(cats[i].name) + '</option>';
            }

            document.getElementById('modal-root').innerHTML =
                '<div class="modal-backdrop" onclick="if(event.target===this)closeModal()">' +
                '  <div class="modal-card p-6">' +
                '    <div class="flex items-center justify-between mb-4">' +
                '      <h3 class="text-lg font-semibold">' + (editing ? 'Edit Product' : 'Add Product') + '</h3>' +
                '      <button onclick="closeModal()" class="text-stone-400 hover:text-stone-700"><i class="fa-solid fa-xmark"></i></button>' +
                '    </div>' +
                '    <form onsubmit="saveProductForm(event,' + (editing ? editing.id : 'null') + ')" novalidate class="space-y-4">' +
                '      <div><label class="block text-sm font-medium text-stone-700 mb-1">Name</label><input id="p-name" class="form-input w-full border border-stone-200 rounded-lg px-4 py-2.5 text-sm" value="' + esc(editing ? editing.name : '') + '"></div>' +
                '      <div><label class="block text-sm font-medium text-stone-700 mb-1">Description</label><textarea id="p-desc" rows="3" class="form-input w-full border border-stone-200 rounded-lg px-4 py-2.5 text-sm">' + esc(editing ? editing.description : '') + '</textarea></div>' +
                '      <div class="grid grid-cols-2 gap-3">' +
                '        <div><label class="block text-sm font-medium text-stone-700 mb-1">Price (Rs.)</label><input id="p-price" type="number" min="0" class="form-input w-full border border-stone-200 rounded-lg px-4 py-2.5 text-sm" value="' + (editing ? editing.price : '') + '"></div>' +
                '        <div><label class="block text-sm font-medium text-stone-700 mb-1">Stock</label><input id="p-stock" type="number" min="0" class="form-input w-full border border-stone-200 rounded-lg px-4 py-2.5 text-sm" value="' + (editing ? editing.stock : 0) + '"></div>' +
                '      </div>' +
                '      <div class="grid grid-cols-2 gap-3">' +
                '        <div><label class="block text-sm font-medium text-stone-700 mb-1">Category</label><select id="p-cat" class="form-input w-full border border-stone-200 rounded-lg px-4 py-2.5 text-sm bg-white">' + catOpts + '</select></div>' +
                '        <div><label class="block text-sm font-medium text-stone-700 mb-1">Badge (optional)</label><input id="p-badge" class="form-input w-full border border-stone-200 rounded-lg px-4 py-2.5 text-sm" value="' + esc(editing ? (editing.badge || '') : '') + '"></div>' +
                '      </div>' +
                '      <div><label class="block text-sm font-medium text-stone-700 mb-1">Image Path</label><input id="p-image" class="form-input w-full border border-stone-200 rounded-lg px-4 py-2.5 text-sm" placeholder="images/example.jpg" value="' + esc(editing ? editing.image : 'images/') + '"><p class="text-xs text-stone-400 mt-1">Relative to project root, e.g. <code>images/monitor-stand-wood-desk.jpg</code></p></div>' +
                '      <div class="flex justify-end gap-2 pt-2">' +
                '        <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm text-stone-600 hover:bg-stone-100">Cancel</button>' +
                '        <button type="submit" class="bg-stone-900 text-white px-5 py-2 rounded-lg text-sm font-medium hover:bg-stone-800">' + (editing ? 'Save Changes' : 'Create Product') + '</button>' +
                '      </div>' +
                '    </form>' +
                '  </div>' +
                '</div>';
        }

        function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

        function saveProductForm(e, id) {
            e.preventDefault();
            var name = document.getElementById('p-name').value.trim();
            var desc = document.getElementById('p-desc').value.trim();
            var price = parseFloat(document.getElementById('p-price').value);
            var stock = parseInt(document.getElementById('p-stock').value);
            var cat = document.getElementById('p-cat').value;
            var badge = document.getElementById('p-badge').value.trim();
            var image = document.getElementById('p-image').value.trim();

            if (!name || !desc || isNaN(price) || price < 0 || isNaN(stock) || stock < 0 || !image) {
                showToast('Please fill all required fields');
                return;
            }

            var list = getProducts();
            if (id) {
                var target = list.find(function (p) { return p.id === id; });
                if (!target) return;
                target.name = name; target.description = desc; target.price = price; target.stock = stock;
                target.category = cat; target.badge = badge; target.image = image;
            } else {
                var nextId = list.length ? Math.max.apply(null, list.map(function (p) { return p.id; })) + 1 : 1;
                list.push({ id: nextId, name: name, description: desc, price: price, stock: stock, category: cat, badge: badge, image: image, rating: 5, reviews: 0 });
            }
            saveProducts(list);
            closeModal();
            renderProducts();
            showToast('Product saved');
        }

        function deleteProduct(id) {
            if (!confirm('Delete this product? This cannot be undone.')) return;
            var list = getProducts().filter(function (p) { return p.id !== id; });
            saveProducts(list);
            renderProducts();
            showToast('Product deleted');
        }

        loadCategoryFilter();
        renderProducts();
    </script>
</body>
</html>
